name: Build AI model + deploy
on:
  push:
    paths: ['index-template.html*', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install numpy + PyTorch (CPU)
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install numpy

      - name: Train transformer AI risk model (round 1)
        run: python3 train_ai.py 160

      - name: Train transformer AI risk model (round 2, validates + exports)
        run: python3 train_ai.py 90 resume

      - name: Verify quantized model
        run: python3 verify_model.py

      - name: Build index.html (embed model)
        run: python3 build.py

      - name: Commit built artifacts
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html model.json
          git diff --cached --quiet && echo "nothing to commit" && exit 0
          git commit -m "Build index.html with embedded 8.27M-param transformer AI model [skip ci]"
          git push

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Deploy to Netlify
        env:
          NETLIFY_PROXY: ${{ secrets.NETLIFY_PROXY }}
        run: npx -y @netlify/mcp@latest --site-id 558243db-c1d1-4b1e-bd22-cf024ef816be --proxy-path "$NETLIFY_PROXY"
